name: Generate editorial image assets
on:
  push:
    branches:
      - redesign/editorial-calling-card
    paths:
      - 'scripts/generate_assets.py'
      - 'src/assets/me.jpeg'
      - 'public/fonts/InstrumentSerif-Regular.ttf'
      - '.github/workflows/generate-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate assets
        run: |
          python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
          python scripts/generate_assets.py
      - name: Commit generated images to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/og-image.jpg public/portraits/
          if ! git diff --cached --quiet; then
            git commit -m "Generate responsive portrait and editorial OG image"
            git push
          fi
