name: Build and Release Resume

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allow manual triggers

jobs:
  build-resume:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for creating releases
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install LaTeX
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          texlive-base \
          texlive-latex-base \
          texlive-latex-recommended \
          texlive-latex-extra \
          texlive-fonts-recommended \
          texlive-fonts-extra \
          latexmk \
          lmodern
          
    - name: Compile resume to PDF
      run: |
        pdflatex -interaction=nonstopmode resume.tex
        # Run twice to resolve references
        pdflatex -interaction=nonstopmode resume.tex
        
    - name: Check if PDF was created
      run: |
        if [ ! -f resume.pdf ]; then
          echo "ERROR: resume.pdf was not created!"
          exit 1
        fi
        ls -la resume.pdf
        
    - name: Generate timestamp for release
      id: timestamp
      run: echo "timestamp=$(date +'%Y-%m-%d-%H%M%S')" >> $GITHUB_OUTPUT
      
    - name: Create Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: resume-${{ steps.timestamp.outputs.timestamp }}
        name: Resume ${{ steps.timestamp.outputs.timestamp }}
        body: |
          🎯 **Automated Resume Build**
          
          📅 **Build Date:** ${{ steps.timestamp.outputs.timestamp }}
          📝 **Commit:** ${{ github.sha }}
          
          📄 **Download:** [resume.pdf](https://github.com/${{ github.repository }}/releases/download/resume-${{ steps.timestamp.outputs.timestamp }}/resume.pdf)
          
          This release was automatically generated when the resume.tex file was updated.
        files: |
          resume.pdf
        draft: false
        prerelease: false
        
    - name: Upload PDF as artifact (for PRs and testing)
      uses: actions/upload-artifact@v4
      with:
        name: resume-pdf-${{ github.sha }}
        path: resume.pdf
        retention-days: 30 